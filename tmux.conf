# ============================================================================
# GENERAL
# ============================================================================
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"  # True color support

set -g mouse on                  # Enable mouse support
set -g history-limit 10000       # Increase scrollback buffer
set -g base-index 1              # Start window numbering at 1
set -g pane-base-index 1         # Start pane numbering at 1
set -g renumber-windows on       # Renumber windows when one is closed
set -sg escape-time 10           # Faster key response (important for Neovim)
set -g focus-events on           # Needed for Neovim autoread

# ============================================================================
# PREFIX
# ============================================================================
set -g prefix C-b                # Change prefix to Ctrl+a
bind C-b send-prefix             # Press Ctrl+a twice to send it to app

# ============================================================================
# KEY BINDINGS
# ============================================================================

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split panes (use current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes with Vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Vim keys (hold prefix and use arrow keys)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# New window keeping current path
bind c new-window -c "#{pane_current_path}"

# ============================================================================
# COPY MODE (Vi-style)
# ============================================================================
set -g mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ============================================================================
# STATUS BAR
# ============================================================================
set -g status-position bottom
set -g status-interval 5

# Colors
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#89b4fa,fg=#1e1e2e"

# Left: session name
set -g status-left " #S "
set -g status-left-length 20

# Right: date and time
set -g status-right " %H:%M  %d %b "
set -g status-right-length 30

# Window list
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
